[general]
import = [
    "~/.config/alacritty/themes/themes/one_light.toml"
]


[env]
TERM = "xterm-256color"

[font]
size = 17
[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"


[window]
# decorations = "none"
opacity = 0.8

[window.dimensions]
columns = 100
lines = 30

[keyboard] 
bindings = [ 
  {  key = "Return", mods = "Shift", chars = "\n" },
  { key = "Back", mods = "Control", chars = "\u001b\u007f" },

  # cmd+number -> ctrl+space+number (prefix \x00)
  { key = "1", mods = "Command", chars = "\u00001" },
  { key = "2", mods = "Command", chars = "\u00002" },
  { key = "3", mods = "Command", chars = "\u00003" },
  { key = "4", mods = "Command", chars = "\u00004" },
  { key = "5", mods = "Command", chars = "\u00005" },
  { key = "6", mods = "Command", chars = "\u00006" },
  { key = "7", mods = "Command", chars = "\u00007" },
  { key = "8", mods = "Command", chars = "\u00008" },
  { key = "9", mods = "Command", chars = "\u00009" },

  # ctrl+number -> ctrl+b+number (prefix \x02)
  { key = "1", mods = "Control", chars = "\u00021" },
  { key = "2", mods = "Control", chars = "\u00022" },
  { key = "3", mods = "Control", chars = "\u00023" },
  { key = "4", mods = "Control", chars = "\u00024" },
  { key = "5", mods = "Control", chars = "\u00025" },
  { key = "6", mods = "Control", chars = "\u00026" },
  { key = "7", mods = "Control", chars = "\u00027" },
  { key = "8", mods = "Control", chars = "\u00028" },
  { key = "9", mods = "Control", chars = "\u00029" },

  # ctrl+cmd+h/l -> swap tmux windows
  { key = "H", mods = "Control|Command", chars = "\u0000<" },
  { key = "L", mods = "Control|Command", chars = "\u0000>" },

  # ctrl+shift+h/l -> navigate tmux windows
  { key = "H", mods = "Control|Shift", chars = "\u0000p" },
  { key = "L", mods = "Control|Shift", chars = "\u0000n" },

  # ctrl+(shift)+tab -> navigate tmux windows
  { key = "Tab", mods = "Control",       chars = "\u0000n" },
  { key = "Tab", mods = "Control|Shift", chars = "\u0000p" },

  # cmd+t -> new tmux window
  { key = "T", mods = "Command", chars = "\u0000c" },

  # cmd+w -> kill tmux pane
  { key = "W", mods = "Command", chars = "\u0000x" },
]

